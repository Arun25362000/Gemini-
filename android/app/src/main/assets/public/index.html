<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Emergency cache clear if app is stuck - check this FIRST
      if (window.location.search.includes('reset=true')) {
        console.log('Resetting application...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) registration.unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) {
              caches.open(name).then(cache => {
                cache.delete('/u-logo.png');
                cache.delete('/logo.png');
                cache.delete('/identity-unnati-final.png');
                cache.delete('/brand-unnati-official.png');
              });
              caches.delete(name);
            }
          });
        }
        localStorage.clear();
        sessionStorage.clear();
        // Clear cookies
        document.cookie.split(";").forEach(function(c) { 
          document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
        });
        window.location.href = window.location.origin;
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#013125" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
